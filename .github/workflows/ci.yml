name: CI/CD Pipeline

on:
  pull_request:
    types: [opened, synchronize, closed]
  push:
    branches: [dev, staging, main]

env:
  NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}

jobs:
  # ── PR Preview: Create Neon branch, run migrations, build ──
  preview:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Neon CLI
        run: npm install -g neonctl

      - name: Create Neon preview branch
        id: neon
        run: |
          neon branches create \
            --name pr-${{ github.event.pull_request.number }} \
            --parent dev \
            --project-id $NEON_PROJECT_ID \
            --output json > branch.json
          echo "db_url=$(jq -r '.connection_uri' branch.json)" >> $GITHUB_OUTPUT
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}

      - name: Run migrations on preview branch
        run: npx prisma migrate deploy
        env:
          DIRECT_URL: ${{ steps.neon.outputs.db_url }}
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npx next build
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
          DIRECT_URL: ${{ steps.neon.outputs.db_url }}
          NEON_AUTH_BASE_URL: ${{ secrets.NEON_AUTH_BASE_URL }}
          NEON_AUTH_COOKIE_SECRET: ${{ secrets.NEON_AUTH_COOKIE_SECRET }}

  # ── PR Closed: Delete preview branch ──
  cleanup-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Install Neon CLI
        run: npm install -g neonctl

      - name: Delete Neon preview branch
        run: |
          neon branches delete pr-${{ github.event.pull_request.number }} \
            --project-id $NEON_PROJECT_ID || true
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}

  # ── Push to dev: Run migrations ──
  deploy-dev:
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run migrations on dev
        run: npx prisma migrate deploy
        env:
          DIRECT_URL: ${{ secrets.DEV_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}

  # ── Push to staging: Run migrations on staging ──
  deploy-staging:
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run migrations on staging
        run: npx prisma migrate deploy
        env:
          DIRECT_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npx next build
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.STAGING_DATABASE_URL }}
          NEON_AUTH_BASE_URL: ${{ secrets.NEON_AUTH_BASE_URL }}
          NEON_AUTH_COOKIE_SECRET: ${{ secrets.NEON_AUTH_COOKIE_SECRET }}

  # ── Push to main: Run migrations on production ──
  deploy-production:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run migrations on production
        run: npx prisma migrate deploy
        env:
          DIRECT_URL: ${{ secrets.PROD_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
